  # === 六、历史经验提取（能力6） ===
  - id: SIM24
    skill: simulation
    category: 历史经验
    description: 相似洪水历史查询（正常）
    question: "历史上三岔水库遇到过类似200mm/48h的洪水吗？当时是怎么调度的？"
