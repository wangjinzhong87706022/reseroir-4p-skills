# simulation 评估集（cull 自 simulation/tests/test-questions.md 98 题 + autoresearch-simulation/questions.tsv）
# 按 evaluator.py::CATEGORY_MAP 的 22 个分类各留代表（正常/异常/边界三类齐全）。
# 三岔水库 sancha (tenant 18)；当前水位 459.18m，汛限 462.5m（非汛期）/462.88m（汛期），死水位 451m，
# 校核洪水位 462.88m，最大下泄 191 m³/s，下游安全泄量 95.1 m³/s；历史洪水 11 条。
# live_db 的 truth_query 仅用 plan-generation/autoresearch-plan-skill/eval.py::get_ground_truth 验证过的生产 SQL。
forbidden_keywords: []
cases:
  # === 一、多方案对比预演（能力1） ===
  - id: SIM1
    skill: simulation
    category: 多方案对比
    description: 历史洪水三方案对比（正常，已知削峰率 23.34%）
    question: "2018年第二场次洪水（id=1），分别用防洪优先、综合平衡、兴利优先三个方案做预演对比，看哪个方案效果最好"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 240
    source: simulation/tests/test-questions.md::Q1
    truth_source: inline
    expected_keywords: ["削峰率", "方案"]
  - id: SIM2
    skill: simulation
    category: 多方案对比
    description: 长历时洪水方案对比（正常）
    question: "对2020年8月那场长历时洪水（id=11），用不同调度方案预演一下，看看削峰率差多少"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 240
    source: simulation/tests/test-questions.md::Q2
    truth_source: inline
    expected_keywords: ["削峰率", "方案"]
  - id: SIM3
    skill: simulation
    category: 多方案对比
    description: 自动生成方案并推荐（正常）
    question: "用默认的3组方案预演2023年7月典型暴雨洪水（id=17），给出推荐方案和理由"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 240
    source: simulation/tests/test-questions.md::Q6
    truth_source: rubric
    expected_keywords: ["推荐", "方案"]
    rubric:
      - 给出 3 组不同策略方案对比
      - 明确推荐理由（削峰率/最高水位）
      - 不编造未运行的方案数据
  - id: SIM4
    skill: simulation
    category: 多方案对比_异常
    description: 失败洪水（status=3）多方案预演（异常）
    question: "对2018年第一场次洪水（id=9）做多方案预演，看看结果怎么样"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 180
    source: simulation/tests/test-questions.md::Q7
    truth_source: rubric
    expected_keywords: ["失败", "status"]
    rubric:
      - 识别 status=3（失败）状态
      - 如实执行/尝试多方案预演并报告真实结果：若结果存在，基于真实输出解读并标注"该洪水 status=3、结果可能低质量"的背景；若结果不存在，如实说明预演失败或返回空
      - 不编造预演结果数据
  - id: SIM5
    skill: simulation
    category: 多方案对比_边界
    description: 不存在的洪水 ID（异常边界）
    question: "我想预演一个不存在的洪水（id=999），看看会怎样"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 120
    source: simulation/tests/test-questions.md::Q9
    truth_source: rubric
    expected_keywords: ["不存在", "未找到"]
    rubric:
      - 检测洪水 id=999 不存在
      - 返回明确"未找到"提示而非崩溃
      - 不编造虚拟结果
  # === 二、结果智能解读（能力2） ===
  - id: SIM6
    skill: simulation
    category: 结果解读
    description: 历史洪水调度效果解读（正常，已知数据）
    question: "帮我解读一下2018年第二场次洪水（id=1）的预演结果，这场洪水的调度效果怎么样？"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 180
    source: simulation/tests/test-questions.md::Q14
    truth_source: inline
    expected_keywords: ["削峰率", "23.34"]
  - id: SIM7
    skill: simulation
    category: 结果解读
    description: 水位距汛限安全评估（正常）
    question: "2018年第二场次洪水（id=1）的最高水位458m，距汛限水位462.88m还有多远？算安全吗？"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 120
    source: simulation/tests/test-questions.md::Q16
    truth_source: inline
    expected_keywords: ["安全", "水位"]
  - id: SIM8
    skill: simulation
    category: 结果解读
    description: 两场洪水对比解读（正常）
    question: "对比一下2018年两场洪水（id=1和id=9）的调度效果，哪场处理得好？"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 180
    source: simulation/tests/test-questions.md::Q19
    truth_source: rubric
    expected_keywords: ["对比", "效果"]
    rubric:
      - 给出两场洪水的关键指标对比（削峰率/最高水位）
      - 标注 id=9 的失败/低质量背景：明确指出 status=3，或指出其结果异常（削峰率 0%/下泄 0/拦蓄时长 0）并说明不宜作为效果基准，均判满足
      - 给出明确的"哪场更好"判断及理由
  - id: SIM9
    skill: simulation
    category: 结果解读_异常
    description: 解读失败洪水结果（异常，id=17 数据质量存疑）
    question: "帮我解读2023年7月典型暴雨洪水（id=17）的预演结果"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 120
    source: simulation/tests/test-questions.md::Q20
    truth_source: rubric
    expected_keywords: ["预演", "结果"]
    rubric:
      - 如实核查该洪水的预演结果数据：若结果存在，基于真实数据解读且不编造数值（削峰率/最高水位等须与真实输出一致）；若结果不存在，给出"无可解读结果"提示
      - 不编造削峰率/最高水位数值
      - 对结果数据的来源/质量有明确交代（如标注数据为失败洪水低质量结果或历史残留）
  - id: SIM10
    skill: simulation
    category: 结果解读_边界
    description: 数据合理性核实（边界，入库 458 出库 20）
    question: "2018年第二场次洪水（id=1）的入库洪峰458 m³/s，出库只有20 m³/s，这个数据对吗？帮我核实一下"
    env: {SRM_TENANT_ID: 18, SRM_RESERVOIR_NAME: sancha}
    timeout: 120
    source: simulation/tests/test-questions.md::Q23
    truth_source: rubric
    expected_keywords: ["核实", "数据"]
    rubric:
      - 交叉验证入库/出库数据合理性
      - 给出明确"合理/异常"判断
      - 不简单复述题目数据
