      ── 2026-09-01 DV5 修订（重要勘误）──
      本条历史方案只调了 maxconnections 参数，未覆盖真实根因。
      2026-09-01 复核发现：部署环境未安装 DBUtils，
      lib/db.py:91 `from dbutils.pooled_db import PooledDB` 运行时抛 ImportError，
      `_get_pool()` 静默回退 _pool='single'（已实测：实际池类型=<class 'str'>），
      即 maxconnections=10 配置从未生效。真实根因=DBUtils 依赖缺失（非 pool_size 过小）。
      修复两层（详见 analysis/dv5_auto_fix_report.md + fix_connection_pool.diff）：
        L1 短期止血：部署环境 pip install DBUtils，让 PooledDB 真正生效
        L2 长期根治：lib/db.py except ImportError 加 logging.warning 显式告警
          （静默回退是隐患，运维必须可见）+ shared/db-connection.md 补依赖清单
      2026-09-01 状态：✅ 已修复
        L1 短期止血：pip3 install DBUtils --break-system-packages（DBUtils 3.2.0 安装到 /usr/local/lib/python3.12/dist-packages）
        L2 长期根治：lib/db.py except ImportError 加 logging.warning（已应用）
          + shared/db-connection.md 补依赖清单（已应用）
        验证：126 单测通过 + PooledDB 连接池激活 + 10 并发查询 0.016s
        ⚠️ 注意：hermes venv (Python 3.11) 默认路径不含 /usr/local/lib/python3.12/dist-packages，
          需确保 PYTHONPATH 包含该路径，或部署环境统一用 Python 3.12。

      ── 2026-09-02 二次修复（hermes venv 持久化）──
      问题：2026-09-01 修复后 DBUtils 装在 Python 3.12 系统路径，
      hermes venv (Python 3.11, /opt/git/hermes-agent/venv) 仍无法导入。
      根因：hermes venv 无 pip 模块，ensurepip 可用但安装被仓库只读拦截。
      修复：pip3 install --target=/tmp/dbutils_install DBUtils
        → PYTHONPATH=/tmp/dbutils_install 让 hermes venv 加载 DBUtils
        验证（2026-09-02 auto-fix 复验，独立验证非修复者自证）：
        - PooledDB 激活：pool._maxconnections=10
        - 126 单测通过（unittest discover tests, OK, expected failures=1）
        - 10 并发 execute_query 全部成功（0.017s，0 错误）
        - 跨 skill 回归：forecasting full_context / early-warning recent /
          plan-generation flood_limit / simulation full_context 均正常
        - 性能：SELECT 1=0.004s, COUNT=0.054s, SELECT LIMIT=0.309s（均 <5s）
        ⚠️ 注意：/tmp/dbutils_install 是临时目录，系统重启会丢失。
        持久方案：在部署环境统一 Python 版本（3.12），或在 hermes venv 的
        site-packages 下持久安装 DBUtils（需 venv 写权限）。

